<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>GoChat Server Lab6</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background: #1e293b;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            list-style: none;
        }

        #chat li {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 10px;
            background: #1e293b;
        }

        .username {
            font-weight: bold;
            color: #38bdf8;
        }

        footer {
            display: flex;
            padding: 10px;
            background: #1e293b;
        }

        input, textarea {
            border: none;
            border-radius: 8px;
            padding: 10px;
            margin-right: 10px;
        }

        #username {
            width: 150px;
        }

        #message {
            flex: 1;
            resize: none;
        }

        button {
            background: #38bdf8;
            border: none;
            border-radius: 8px;
            padding: 10px 15px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #0ea5e9;
        }
    </style>
</head>
<body>

<header>GoChat - Lab6</header>

<ul id="chat"></ul>

<footer>
    <textarea id="message" placeholder="Escribe un mensaje..."></textarea>
    <button onclick="sendMessage()">Enviar</button>
</footer>

<script src="script.js"></script>
</body>
</html>
